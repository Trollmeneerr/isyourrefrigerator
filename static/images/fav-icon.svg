<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --p: #030b18;
        --p-surface: rgba(10, 25, 48, 0.72);
        --p-card: rgba(14, 32, 60, 0.65);
        --s: #133b78;
        --s-light: #1e56a8;
        --t: #0d8cf1;
        --t-glow: rgba(13, 140, 241, 0.35);
        --cyan: #38bdf8;
        --cyan-glow: rgba(56, 189, 248, 0.25);
        --green: #22c55e;
        --green-glow: rgba(34, 197, 94, 0.25);
        --acc: #050505;
        --text: #f8fafc;
        --text-dim: rgba(248, 250, 252, 0.75);
        --text-faint: rgba(248, 250, 252, 0.45);
        --glass: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.12);
        --glass-hover-border: rgba(56, 189, 248, 0.45);
        --hair: rgba(255, 255, 255, 0.08);
        --radius-lg: 20px;
        --radius-md: 14px;
        --radius-sm: 8px;
      }
      .bg { fill: var(--s); }
      .center-glow { fill: var(--cyan-glow); }
      .center-dot { fill: var(--text); }
      .snowflake-arc {
        fill: none;
        stroke: var(--text);
        stroke-width: 8;
        stroke-linecap: round;
        filter: drop-shadow(0px 0px 6px var(--t-glow));
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" class="bg" rx="12" />

  <!-- Central Glow & Dot -->
  <circle cx="100" cy="100" r="14" class="center-glow" />
  <circle cx="100" cy="100" r="4" class="center-dot" />

  <!-- 6 Curved Lines (Flipped 180° so curves arc around the center, widened, white color) -->
  <g>
    <!-- Base line (flipped arc curve below center line) -->
    <path d="M 40,120 Q 100,140 160,120" class="snowflake-arc" />
    
    <!-- Rotated 60° increments around center (100, 100) -->
    <path d="M 40,120 Q 100,140 160,120" class="snowflake-arc" transform="rotate(60, 100, 100)" />
    <path d="M 40,120 Q 100,140 160,120" class="snowflake-arc" transform="rotate(120, 100, 100)" />
    <path d="M 40,120 Q 100,140 160,120" class="snowflake-arc" transform="rotate(180, 100, 100)" />
    <path d="M 40,120 Q 100,140 160,120" class="snowflake-arc" transform="rotate(240, 100, 100)" />
    <path d="M 40,120 Q 100,140 160,120" class="snowflake-arc" transform="rotate(300, 100, 100)" />
  </g>
</svg>
